name: review-video
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [list, hold, publish, reschedule, delete]
        default: list
      video_id:
        description: "YouTube video id (not needed for list)"
        required: false
      when:
        description: "For reschedule: 2026-10-14 09:00 (local time)"
        required: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python review.py "$ACTION" "$VIDEO_ID" "$WHEN"
        env:
          ACTION: ${{ inputs.action }}
          VIDEO_ID: ${{ inputs.video_id }}
          WHEN: ${{ inputs.when }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_TZ: ${{ vars.PUBLISH_TZ }}
