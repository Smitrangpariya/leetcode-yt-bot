name: Manual Hindi or Bilingual Video

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Generate Hindi/Hinglish only, or both English and Hindi/Hinglish"
        required: true
        type: choice
        default: hi
        options:
          - hi
          - both
      problem_id:
        description: "Optional LeetCode problem ID. Leave blank to use the next sequence problem."
        required: false
        type: string
        default: ""
      force:
        description: "Regenerate even if the language version was already marked complete"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: manual-language-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
      KOKORO_VOICE: ${{ vars.KOKORO_VOICE }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
      PUBLISH_TIME: ${{ vars.PUBLISH_TIME }}
      PUBLISH_TZ: ${{ vars.PUBLISH_TZ }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      REGION: ${{ vars.REGION }}
      CODE_LANGUAGE: ${{ vars.CODE_LANGUAGE }}
      LANGUAGE: en
      LANGUAGE_CHOICE: ${{ inputs.language }}
      REQUESTED_PROBLEM_ID: ${{ inputs.problem_id }}
      FORCE_REGENERATE: ${{ inputs.force }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube OAuth token
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get("YOUTUBE_TOKEN_JSON", "").strip()
          if not value:
              raise SystemExit(
                  "Missing repository secret YOUTUBE_TOKEN_JSON. "
                  "Add the serialized contents of token.json in Settings > Secrets and variables > Actions."
              )
          # Validate before writing so malformed secrets fail with a clear message.
          import json
          json.loads(value)
          Path("token.json").write_text(value, encoding="utf-8")
          print("YouTube OAuth token restored.")
          PY

      - name: Generate and upload selected language version(s)
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          SEQUENCE_BEFORE="$(python -c 'from pipeline.leetcode import get_current_sequence_id; print(get_current_sequence_id())')"
          if [[ -n "$REQUESTED_PROBLEM_ID" ]]; then
            PROBLEM_ID="$REQUESTED_PROBLEM_ID"
          else
            PROBLEM_ID="$SEQUENCE_BEFORE"
          fi

          if ! [[ "$PROBLEM_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid problem ID: '$PROBLEM_ID'" >&2
            exit 1
          fi

          FORCE_ARGS=()
          if [[ "$FORCE_REGENERATE" == "true" ]]; then
            FORCE_ARGS+=(--force)
          fi

          echo "Selected problem: #$PROBLEM_ID"
          echo "Language mode: $LANGUAGE_CHOICE"

          case "$LANGUAGE_CHOICE" in
            hi)
              python main.py --id "$PROBLEM_ID" --lang hi --no-advance "${FORCE_ARGS[@]}"
              ;;
            both)
              # Use the same problem ID for both language versions and prevent either
              # individual run from advancing the daily sequence.
              python main.py --id "$PROBLEM_ID" --lang en --no-advance "${FORCE_ARGS[@]}"
              python main.py --id "$PROBLEM_ID" --lang hi --no-advance "${FORCE_ARGS[@]}"

              # If this was the next sequential problem, advance once after both uploads.
              # If an older/specific problem was selected, leave the daily pointer alone.
              if [[ "$PROBLEM_ID" == "$SEQUENCE_BEFORE" ]]; then
                python - "$PROBLEM_ID" <<'PY'
          import sys
          from pipeline.leetcode import advance_sequence
          advance_sequence(int(sys.argv[1]))
          PY
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add data/sequence.json
                if ! git diff --cached --quiet; then
                  git commit -m "chore: advance sequence after bilingual upload [skip ci]"
                  git push
                else
                  echo "Sequence file did not change; no commit needed."
                fi
              fi
              ;;
            *)
              echo "Unsupported language mode: $LANGUAGE_CHOICE" >&2
              exit 1
              ;;
          esac

      - name: Clean up secret files
        if: always()
        run: rm -f token.json client_secret.json
