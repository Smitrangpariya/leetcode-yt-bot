name: daily-leetcode-video
on:
  schedule:
    - cron: "30 3 * * *"        # 03:30 UTC = 09:00 AM IST
  workflow_dispatch:
    inputs:
      problem_id:
        description: "Specific LeetCode problem ID (leave blank for next in sequence)"
        type: string
        default: ""
      lang:
        description: "Narration language (en = English, hi = Hindi/Hinglish)"
        type: choice
        options:
          - ""
          - en
          - hi
        default: ""
      dry_run:
        description: "Build the video but do not upload"
        type: boolean
        default: false

permissions:
  contents: write                # needed to commit data/sequence.json

concurrency: daily-video

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-jetbrains-mono espeak-ng

      - uses: actions/cache@v4
        with:
          path: data/models
          key: kokoro-model-v1

      - run: pip install -r requirements.txt

      # Write secrets to files (cleaned up in post-step)
      - name: Write YouTube credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      - name: Run pipeline
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run --advance"; fi
          if [ -n "${{ inputs.problem_id }}" ]; then ARGS="$ARGS --id ${{ inputs.problem_id }}"; fi
          if [ -n "${{ inputs.lang }}" ]; then ARGS="$ARGS --lang ${{ inputs.lang }}"; fi
          python main.py $ARGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          PUBLISH_TIME: ${{ vars.PUBLISH_TIME }}
          PUBLISH_TZ: ${{ vars.PUBLISH_TZ }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          REGION: ${{ vars.REGION }}
          CODE_LANGUAGE: ${{ vars.CODE_LANGUAGE }}
          LANGUAGE: ${{ vars.LANGUAGE }}

      # ALWAYS clean up secrets before any git operations
      - name: Clean up secret files
        if: always()
        run: rm -f client_secret.json token.json

      - name: Commit sequence pointer
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sequence.json
          git diff --cached --quiet || git commit -m "chore: advance sequence pointer [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-preview
          path: |
            data/*/final.mp4
            data/*/thumb.jpg
            data/*/metadata.json
          retention-days: 3
